name: Native nightly

# Nightly gate for the native tests (`#[ignore = "native..."]`) that need nothing but the file system. ci.yml never passes
# `--include-ignored`, so PARITY rows that rely on native mutation killers (X-physical-fs, AR16, SEC-01, D-05, INV-8, F-16) had no
# regression gate (docs/reviews/AUDIT-DONE-2026-10-30.md, "Native tests are not gated"). NOT a required check: it is not part of the
# master-ci ruleset and nothing in ci.yml lists it in `needs`, so a red night never blocks a pull request.
#
# Deliberately NOT run here (they need something the runner does not have; this workflow downloads nothing):
#  - pr-libraw and pr-turbojpeg native binaries, pr-imaging-raw/raf_reader, pr-imaging cache_preview_file/memory_headroom and the
#    pr-platform-win binaries wic_imaging_twins_preview and wic_preview_service_broken_entry: they load the pinned libraw.dll /
#    turbojpeg.dll or need WIC, which tools/dev/stage-native.ps1 copies from the local C# checkout (the C# repo is not cloned in CI
#    and fetching real DLLs is blocked by decision P-55). (pr-imaging cache_disk_store, cache_key, preview_service_disk and
#    thumbnail_cache only need the file system and icacls: verified green on a machine without staged DLLs on 2026-10-31, so they run
#    below.)
#  - (the four window binaries named in the pr-platform-win list below were added 2026-10-31 and are unconfirmed until one night)
#  - pr-libraw raw_share_delete (4 native tests, 2026-10-31): needs libraw.dll (stage-native, blocked by P-55) and python for the synthetic DNG; no staging mechanism exists in this workflow, so it is NOT listed.
#  - the window, DWM, GPU and input-desktop families of pr-platform-win (dialogs_*, host_*, shell_*, gfx_*, render_*, win32_*, wic_*,
#    w8_*) and pr-shell (ui_smoke*, startup_*; except the two pr-shell binaries added 2026-10-31 below): they need a real desktop and the NativeDialog tooltip tests move the real cursor.
#  - pr-bench (runs the benchmark tool) and anything that touches the real Recycle Bin: nothing here may.
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  native:
    name: native tests (file system, journal)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show
      - name: Cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: native-nightly
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Native tests
        timeout-minutes: 50
        shell: pwsh
        run: |
          # Config and user data go to a throw-away folder, never to %LOCALAPPDATA%\PhotoReview. The tests make their own temp
          # folders and use fakes for the Recycle Bin.
          $root = Join-Path $env:RUNNER_TEMP 'photoreview-native'
          New-Item -ItemType Directory -Force $root | Out-Null
          $env:PHOTOREVIEW_RS_ISOLATE_CONFIG = '1'
          $env:PHOTOREVIEW_RS_DATA_ROOT = $root
          # crate = test binaries. pr-core: every binary with native tests (none of them loads a pinned DLL).
          $plan = [ordered]@{
            'pr-core' = @(
              'catalog_sorting', 'file_actions_destination_policy', 'file_actions_journal', 'file_actions_journal_compaction',
              'file_actions_partial_cleanup', 'file_actions_recovery_check', 'file_actions_service_native', 'io_journal_compaction_files',
              'io_physical', 'io_physical_seams', 'journal_reconcile', 'journal_startup_recovery', 'rename_file_action_matrix',
              'rename_recovery', 'rename_service', 'session_store', 'w2_fs_mutation_killers')
            'pr-platform-win' = @('w2_fs_flush_killers', 'w4_mutation_killers2', 'w6_platform_native', 'physical_memory',
              # Composer twins draw on a WARP device (no window, no input desktop). Added 2026-10-31 without a nightly run yet: the first
              # night must confirm that windows-latest has WARP, otherwise remove these two.
              'shell_viewing_composer_twins_native', 'shell_viewing_composer_native',
              # Added 2026-10-31 (st-parity-sync3), no nightly run yet: one night must confirm each of them, remove a binary that is red
              # only because the runner has no interactive desktop. None loads a C# DLL or needs stage-native; none touches the real
              # Recycle Bin or user data. Hidden window / offscreen WARP, needs a desktop session: w8_mainwin_frame_tests (15; one test
              # shows a window minimised), host_shell_window_fixes (2; creates windows and a WH_CALLWNDPROC hook), dialogs_painter_dpi_empty
              # (3 native tests; hidden window + PrintWindow). recycle_final_path: its one native test makes a junction with cmd mklink
              # inside a TempRoot and runs read-only volume queries (no desktop needed); the 6 fake tests run with it.
              # recycle_restore_timeout has no #[ignore] (fakes) and already runs in ci.yml, so it is not listed.
              'w8_mainwin_frame_tests', 'host_shell_window_fixes', 'dialogs_painter_dpi_empty', 'recycle_final_path',
              # Added 2026-10-31 (st-parity-sync5), no nightly run yet: host_main_window_lifecycle (16 native tests, hidden MainWindow incl.
              # the M1 pending_opens case) NEEDS A DESKTOP SESSION; one night must confirm it on windows-latest, remove it if it is red only
              # because the runner has no interactive desktop. recycle_delete_sink has no #[ignore] (fakes) and runs in ci.yml: not listed.
              'host_main_window_lifecycle')
            # Added 2026-10-31 (fix-test-hygiene): green locally with --include-ignored --test-threads=1, no DLL staged. The ACL tests use icacls
            # /deny; a run killed midway can leave an undeletable folder under %TEMP%\pr-rs-tests (hygiene review F12).
            'pr-imaging' = @('cache_disk_store', 'cache_key', 'preview_service_disk', 'thumbnail_cache')
            'pr-app' = @('folder_load_load', 'windowing_placement_store')
            # Added 2026-10-31 (st-parity-sync5), no nightly run yet; each needs a desktop session (hidden MainWindow, dispatcher and shell
            # message loop on a UI thread), no C# DLL and no Recycle Bin: startup_overlay_vm (L6 try_borrow, 3 native tests) and
            # composition_graph (2 native tests incl. dispose_graph_flushes_the_session_writer_...). One night must confirm them; remove
            # a binary that is red only because windows-latest has no interactive desktop.
            'pr-shell' = @('startup_overlay_vm', 'composition_graph')
          }
          $failed = @()
          foreach ($crate in $plan.Keys) {
            foreach ($bin in $plan[$crate]) {
              Write-Host "::group::$crate $bin"
              cargo test -p $crate --locked --test $bin -- --include-ignored --test-threads=1
              if ($LASTEXITCODE -ne 0) { $failed += "$crate/$bin" }
              Write-Host '::endgroup::'
            }
          }
          if ($failed.Count -gt 0) { Write-Host "FAILED: $($failed -join ', ')"; exit 1 }
