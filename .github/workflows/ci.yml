name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI never reuses incremental state; without it the cache stays smaller and builds are not slowed by it.
  CARGO_INCREMENTAL: 0

jobs:
  # Decides whether the Rust jobs are needed. A pull request that only touches documentation, markdown contracts or the tools/ scripts
  # skips lint and tests (about 8 minutes of Windows runners for nothing); pushes to master, manual runs and any change of the workflow,
  # Cargo files, crates, test fixtures or the toolchain always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Changed files
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$files"
          # Not Rust relevant: docs/, tools/ (scripts, oracle sources, autopilot) and markdown anywhere.
          other="$(echo "$files" | grep -vE '^(docs/|tools/)|\.md$' || true)"
          if [ -n "$other" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "Rust jobs needed because of:"
            echo "$other"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/tools changed: Rust jobs skipped"
          fi

  # Required by the master-ci ruleset together with build-test: it must always run and succeed.
  repo-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Synced assets (language catalogs, fixtures) are owned by the C# repo; edits must come from a re-sync.
      - name: Check synced assets
        shell: powershell
        run: ./tools/sync-from-csharp.ps1 -Check

  # Runner time is the budget, not the number of jobs: every Windows job pays about 30 s of setup (checkout, toolchain, cache) and
  # GitHub runs a limited number of Windows jobs at once, so two overlapping runs (a pull request and the master run of the previous
  # merge) used to queue. The work is grouped into five jobs of about two minutes each: lint plus release build, pr-core, the rest of
  # the workspace, pr-platform-win with the pr-app unit tests, and the pr-app integration tests. Only master saves the cache.
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    name: lint and release build
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # No debug info: nothing in CI reads it and writing PDBs is the slowest part of linking on Windows.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is preinstalled on windows-latest; rust-toolchain.toml selects the version and components.
      - name: Toolchain
        run: rustup show
      - name: Cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: lint-release
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # One rustfmt run per package: `cargo fmt --all` hands every test file of the whole workspace to one rustfmt process, which
      # fails with os error 206 (command line too long) on Windows once pr-platform-win and pr-app have enough test files.
      - name: Format
        shell: pwsh
        run: |
          $names = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages.name | Sort-Object
          foreach ($name in $names) {
            cargo fmt -p $name --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release
        run: cargo build --workspace --release --locked

  # `pr-app` has over a hundred integration test files, each linked as its own binary, so it dominates the test time. Its files are
  # split round-robin over 4 shards (computed from the directory on every run, so a new test file needs no workflow edit); the groups
  # below take the shards that balance them (measured step times: core 120 s, crates-rest 120 s, win 69 s + app-unit 12 s + shard 2
  # 23 s, app shards 0, 1 and 3 43 + 31 + 41 s).
  test:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    name: test (${{ matrix.group }})
    runs-on: windows-latest
    # Hang guard: a stuck test fails the job instead of burning the runner (C#: test.runsettings).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [core, crates-rest, win, app]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show
      - name: Cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: test-${{ matrix.group }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Test
        timeout-minutes: 15
        shell: pwsh
        run: |
          $group = '${{ matrix.group }}'
          function Invoke-Cargo {
            cargo @args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # pr-app integration tests of the given shards (round-robin over 4), one cargo invocation.
          function Invoke-AppShards([int[]]$shards) {
            $names = @(Get-ChildItem crates/pr-app/tests -Filter *.rs -File | Sort-Object Name | ForEach-Object { $_.BaseName })
            $targets = @()
            for ($k = 0; $k -lt $names.Count; $k++) {
              if ($shards -contains ($k % 4)) { $targets += '--test'; $targets += $names[$k] }
            }
            Write-Host "shards $($shards -join ',') run $($targets.Count / 2) of $($names.Count) pr-app test files"
            if ($targets.Count -gt 0) { Invoke-Cargo test -p pr-app --locked @targets }
          }
          switch ($group) {
            'core' { Invoke-Cargo test -p pr-core --locked }
            'crates-rest' { Invoke-Cargo test --workspace --exclude pr-app --exclude pr-core --exclude pr-platform-win --locked }
            'win' {
              Invoke-Cargo test -p pr-platform-win --locked
              Invoke-Cargo test -p pr-app --lib --bins --locked
              Invoke-Cargo test -p pr-app --doc --locked
              Invoke-AppShards @(2)
            }
            'app' { Invoke-AppShards @(0, 1, 3) }
          }

  # Gate with the name the master-ci ruleset requires. `if: always()` is needed: a skipped job would otherwise count as passing when
  # an upstream job fails. lint and test are skipped on purpose (and only then) when `changes` found nothing but docs and tools.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, test]
    if: ${{ always() }}
    steps:
      - name: Require the checks that apply
        run: |
          echo "changes=${{ needs.changes.result }} rust=${{ needs.changes.outputs.rust }} lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          test "${{ needs.changes.result }}" = "success" || exit 1
          if [ "${{ needs.changes.outputs.rust }}" = "true" ]; then
            test "${{ needs.lint.result }}" = "success" && test "${{ needs.test.result }}" = "success"
          else
            test "${{ needs.lint.result }}" = "skipped" && test "${{ needs.test.result }}" = "skipped"
          fi
