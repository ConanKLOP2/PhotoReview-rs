name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI never reuses incremental state; without it the cache stays smaller and builds are not slowed by it.
  CARGO_INCREMENTAL: 0

jobs:
  repo-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Synced assets (language catalogs, fixtures) are owned by the C# repo; edits must come from a re-sync.
      - name: Check synced assets
        shell: powershell
        run: ./tools/sync-from-csharp.ps1 -Check

  # The three jobs below run in parallel (wall time = the slowest one, not the sum). Only master saves the cache;
  # pull requests restore it.
  lint:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # No debug info: nothing in CI reads it and writing PDBs is the slowest part of linking on Windows.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is preinstalled on windows-latest; rust-toolchain.toml selects the version and components.
      - name: Toolchain
        run: rustup show
      - name: Cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # `pr-app` has over a hundred integration test files, each linked as its own binary, so it dominates the test time.
  # Its files are split round-robin over 4 shards (computed from the directory on every run, so a new test file needs no
  # workflow edit); core, crates and app-unit run the remaining crate, unit and doc tests in parallel.
  test:
    name: test (${{ matrix.shard }})
    runs-on: windows-latest
    # Hang guard: a stuck test fails the job instead of burning the runner (C#: test.runsettings).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [core, crates, app-unit, "0", "1", "2", "3"]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show
      - name: Cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: test-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Test
        timeout-minutes: 15
        shell: pwsh
        run: |
          $shard = '${{ matrix.shard }}'
          if ($shard -eq 'core') {
            cargo test -p pr-core --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            exit 0
          }
          if ($shard -eq 'crates') {
            cargo test --workspace --exclude pr-app --exclude pr-core --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            exit 0
          }
          if ($shard -eq 'app-unit') {
            cargo test -p pr-app --lib --bins --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test -p pr-app --doc --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            exit 0
          }
          $shards = 4
          $names = @(Get-ChildItem crates/pr-app/tests -Filter *.rs -File | Sort-Object Name | ForEach-Object { $_.BaseName })
          $targets = @()
          for ($k = 0; $k -lt $names.Count; $k++) {
            if ($k % $shards -eq [int]$shard) { $targets += '--test'; $targets += $names[$k] }
          }
          Write-Host "shard $shard runs $($targets.Count / 2) of $($names.Count) pr-app test files"
          if ($targets.Count -eq 0) { exit 0 }
          cargo test -p pr-app --locked @targets
          exit $LASTEXITCODE

  release-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show
      - name: Cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build release
        run: cargo build --workspace --release --locked

  # Gate with the name branch protection requires. `if: always()` is needed: a skipped job would otherwise count
  # as passing when an upstream job fails.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, release-build]
    if: ${{ always() }}
    steps:
      - name: Require lint, test and release build
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} release-build=${{ needs.release-build.result }}"
          test "${{ needs.lint.result }}" = "success" && test "${{ needs.test.result }}" = "success" && test "${{ needs.release-build.result }}" = "success"
