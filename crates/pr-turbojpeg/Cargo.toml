[package]
name = "pr-turbojpeg"
description = "TurboJPEG decoder backend, registered only when the probe succeeds (AR01)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Off by default. Exposes the test-only constructors that turn an arbitrary integer into a native `tjhandle`
# (`TurboJpegHandle::from_raw`, `with_destroy`, `wrap_init_result`); the integration tests enable it via dev-dependencies.
test-support = []

[dependencies]
pr-core.workspace = true
pr-imaging.workspace = true

[dev-dependencies]
pr-turbojpeg = { path = ".", features = ["test-support"] }
pr-test-support.workspace = true
serde_json.workspace = true

# W5-14b native fine-scale tests use the real WIC scaler through a test adapter.
[target.'cfg(windows)'.dev-dependencies]
pr-platform-win.workspace = true
