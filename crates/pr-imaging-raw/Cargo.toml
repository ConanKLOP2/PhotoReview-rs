[package]
name = "pr-imaging-raw"
description = "Camera RAW metadata and embedded JPEG preview (ADR 0009)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pr-core.workspace = true
pr-imaging.workspace = true

[dev-dependencies]
pr-test-support.workspace = true
serde_json.workspace = true
# Pure LibRaw helper/hand-off regressions share the RAW killer binary; no native API is invoked.
pr-libraw.workspace = true

# W5-12b native twins (WicDirectDecoder); no cycle: pr-platform-win depends on pr-core and pr-imaging only.
[target.'cfg(windows)'.dev-dependencies]
pr-platform-win.workspace = true
