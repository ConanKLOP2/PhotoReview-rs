[package]
name = "pr-platform-win"
description = "Explorer order, Recycle Bin, memory status, monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = []
# Phase 0 UI spike (docs/adr/R0001): Win32 window + Direct2D/DirectWrite. Off by default; the normal build is unchanged.
ui-spike = ["windows/Win32_Graphics_Direct2D", "windows/Win32_Graphics_Direct2D_Common", "windows/Win32_Graphics_Direct3D", "windows/Win32_Graphics_Direct3D11", "windows/Win32_Graphics_Dxgi", "windows/Win32_Graphics_Dxgi_Common", "windows/Win32_Graphics_DirectWrite", "windows/Win32_Graphics_Gdi", "windows/Win32_UI_WindowsAndMessaging", "windows/Win32_UI_Input_KeyboardAndMouse", "windows/Win32_UI_HiDpi"]

[lints]
workspace = true

[dependencies]
pr-core.workspace = true
pr-imaging.workspace = true
pr-perf.workspace = true
# D-W8B5-512: the Benchmark dialog (W8-18r/18s) names `pr_bench` profiles and results (`pr-bench` has no dependency on this crate).
pr-bench.workspace = true
# D-W8B1-1: the Direct2D/host types implement the `pr_app::services::render` and host traits (`pr-app` no longer depends on this crate).
pr-app.workspace = true
# D-W8B4O-11: `shell_overlay` names `pr_l10n::localizer::Localizer` (the overlay panels take `&Localizer`, W8-15e); `pr-l10n` has no dependency on this crate.
pr-l10n.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Networking_WinHttp", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectWrite", "Win32_UI_Input", "Win32_UI_Input_Ime", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Time", "Win32_System_ApplicationInstallationAndServicing", "Win32_Globalization"] }
windows-core = { workspace = true }
# `Matrix3x2` / `Vector2` of the Direct2D signatures (`SetTransform`, `DrawTextLayout`); `windows` 0.62 does not re-export them.
windows-numerics = { workspace = true }

[dev-dependencies]
pr-test-support.workspace = true
serde_json.workspace = true
