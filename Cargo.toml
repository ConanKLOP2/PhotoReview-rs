[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every unsafe block must say why it is sound (COM/WIC/LibRaw FFI lives in a few crates).
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
pr-core = { path = "crates/pr-core" }
pr-l10n = { path = "crates/pr-l10n" }
pr-imaging = { path = "crates/pr-imaging" }
pr-imaging-raw = { path = "crates/pr-imaging-raw" }
pr-libraw = { path = "crates/pr-libraw" }
pr-turbojpeg = { path = "crates/pr-turbojpeg" }
pr-platform-win = { path = "crates/pr-platform-win" }
pr-bench = { path = "crates/pr-bench" }
pr-perf = { path = "crates/pr-perf" }
pr-test-support = { path = "crates/pr-test-support" }

# External crates: only the lead adds entries here (docs/MULTI-AGENT-PLAN.md §2.1). Planned ones: docs/adr/R0003.
indexmap = "2"
serde = { version = "1", features = ["derive"] }
# raw_value: W1-14 reads journal numbers token-by-token, since serde_json parses `-0` as a float where
# System.Text.Json accepts it as integer 0.
serde_json = { version = "1", features = ["raw_value"] }
# P-22: WIC COM in pr-platform-win only (W4-11a..e).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_Media_MediaFoundation"] }
windows-core = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
