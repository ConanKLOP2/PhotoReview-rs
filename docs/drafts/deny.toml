# Proposal only. Validate with: cargo deny --config docs/drafts/deny.toml check advisories licenses bans sources
# Allow list derived from cargo metadata --locked --offline on this worktree.
[graph]
all-features = true
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Unlicense", "Unicode-3.0"]
exceptions = []

[bans]
# Cargo.lock currently contains syn 2.0.119 and 3.0.9; denying duplicates fails this graph before review.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
